version: "3.8"

# Proofly 本地依赖编排：MySQL / Redis / MinIO
# 启动：docker compose up -d
# 停止：docker compose down
# 重置数据：docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: proofly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-proofly_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proofly}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库初始化方式由 docs/quickstart.md 统一说明（手动执行 schema.sql / seed-dev.sql），
      # 此处不挂载自动初始化，避免与文档约定冲突。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-proofly_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.8-alpine
    container_name: proofly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: proofly-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首次启动时创建 proofly 桶（可选；后端启动也会尝试创建）
  minio-init:
    image: minio/mc:RELEASE.2024-07-16T19-31-34Z
    container_name: proofly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-proofly};
      mc anonymous set download local/${MINIO_BUCKET:-proofly} || true;
      echo 'MinIO bucket ${MINIO_BUCKET:-proofly} ready';
      "
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  minio-data: