spring:
  datasource:
    # 本地开发默认连接 Docker Compose 中的 MySQL；生产请通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/proofly?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 注意：开发占位密码，生产部署必须通过 DB_PASSWORD 环境变量覆盖
    password: ${DB_PASSWORD:proofly_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.lyllink.proofly: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # MinIO 官方开发默认凭据；生产部署必须通过环境变量覆盖
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:proofly}

proofly:
  auth:
    jwt-secret: ${PROOFLY_AUTH_JWT_SECRET:proofly-local-dev-jwt-secret-must-be-at-least-32-bytes}
    access-token-ttl-minutes: ${PROOFLY_AUTH_ACCESS_TOKEN_TTL_MINUTES:120}
    refresh-token-ttl-days: ${PROOFLY_AUTH_REFRESH_TOKEN_TTL_DAYS:7}
    redis-prefix: ${PROOFLY_AUTH_REDIS_PREFIX:proofly}
