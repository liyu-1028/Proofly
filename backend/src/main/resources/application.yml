spring:
  application:
    name: proofly-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

proofly:
  review-base-url: ${PROOFLY_REVIEW_BASE_URL:http://localhost:5173/review/}
  billing:
    base-price-per-month: ${PROOFLY_BILLING_BASE_PRICE:29.00}
    discounts:
      1: 1.00
      6: 0.90
      12: 0.75
    xpay:
      # 沙箱占位：本地 mock 模式无需真实 appId/appKey；对接真实 XPay 时通过环境变量覆盖
      app-id: ${XPAY_APP_ID:mock_app_id}
      app-key: ${XPAY_APP_KEY:mock_app_key}
      api-url: ${XPAY_API_URL:http://localhost:8080/api/public/webhook/xpay}
  auth:
    # 用户密码BCrypt加密的盐
    jwt-secret: ${PROOFLY_AUTH_JWT_SECRET:proofly-local-dev-jwt-secret-must-be-at-least-32-bytes}
    access-token-ttl-minutes: ${PROOFLY_AUTH_ACCESS_TOKEN_TTL_MINUTES:120}
    refresh-token-ttl-days: ${PROOFLY_AUTH_REFRESH_TOKEN_TTL_DAYS:7}
    redis-prefix: ${PROOFLY_AUTH_REDIS_PREFIX:proofly}
    rsa:
      # 公钥可默认提供；私钥为敏感凭据，必须通过 PROOFLY_AUTH_RSA_PRIVATE_KEY 环境变量注入，禁止入库
      public-key: ${PROOFLY_AUTH_RSA_PUBLIC_KEY:}
      private-key: ${PROOFLY_AUTH_RSA_PRIVATE_KEY:}
